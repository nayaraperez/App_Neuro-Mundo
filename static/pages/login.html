<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <meta name="author" content="Neu Industries">
    <!-- Estilos globales y hoja de estilos específica -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="login-style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-avatar-big">👤</div>

        <div class="login-header">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa tus datos para cambiar de cuenta</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <button type="button" id="togglePassword" class="toggle-btn" title="Mostrar/Ocultar contraseña">👁️</button>
                </div>
            </div>

            <div id="errorMessage" class="error-message">
                Correo o contraseña incorrectos.
            </div>

            <button type="submit" class="btn-primary">Ingresar</button>
        </form>

        <div class="login-footer">
            <a href="usuario.html" class="btn-cancel">Cancelar y volver</a>
        </div>
    </div>

    <!-- Archivo de JavaScript externo -->
    <script src="login-script.js"></script>
</body>
</html>
